[package]
name = "pydmg-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.pydmg]
path = ".."
default-features = false
features = ["fuzzing"]

[[bin]]
name = "dmg_parse"
path = "fuzz_targets/dmg_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blkx"
path = "fuzz_targets/blkx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk"
path = "fuzz_targets/chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gpt"
path = "fuzz_targets/gpt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false
