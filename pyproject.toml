[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pydmg"
version = "0.1.1"
description = "Read, inspect, and create Apple DMG files from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "pydmg contributors" }
]
keywords = ["dmg", "disk-image", "apple", "forensics", "packaging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Filesystems"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bwhitn/pydmg"
Repository = "https://github.com/bwhitn/pydmg"
Issues = "https://github.com/bwhitn/pydmg/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
dev = [
  "maturin>=1.7,<2.0",
  "pytest>=8.0",
  "ruff>=0.8.0",
]

[tool.maturin]
module-name = "pydmg._pydmg"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
