[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pydmg"
version = "0.1.0"
description = "Read, inspect, and create Apple DMG files from Python"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "pydmg contributors" }
]
keywords = ["dmg", "disk-image", "apple", "forensics", "packaging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Filesystems"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/bwhitn/pydmg"
Repository = "https://github.com/bwhitn/pydmg"
Issues = "https://github.com/bwhitn/pydmg/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
dev = [
  "bandit>=1.7.10",
  "coverage[toml]>=7.6",
  "maturin>=1.7,<2.0",
  "mypy>=1.13,<2",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "ruff>=0.8.0",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=6.2,<7",
]

[tool.maturin]
module-name = "pydmg._pydmg"
python-source = "python"
features = ["python", "pyo3/extension-module"]
locked = true
include = [
  { path = "fuzz/Cargo.toml", format = "sdist" },
  { path = "fuzz/dictionaries/*", format = "sdist" },
  { path = "fuzz/fuzz_targets/*.rs", format = "sdist" },
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["python/pydmg", "typing_tests"]

[tool.coverage.run]
branch = true
source = ["python/pydmg"]

[tool.coverage.report]
fail_under = 90
show_missing = true
