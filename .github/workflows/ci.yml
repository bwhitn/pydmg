name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Python integration tests
        run: python -m pytest

  lint:
    name: Lint, Type, And Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Python lint
        run: ruff check .

      - name: Strict static typing
        run: mypy

      - name: Python security lint
        run: bandit -q -r python scripts

      - name: Rust format check
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Rust lint
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: Documentation build
        run: |
          python scripts/build_pydoc.py --cleanup
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

      - name: Dependency license policy
        run: python scripts/check_licenses.py

      - name: Audit exception policy
        run: python scripts/check_audit_exceptions.py

      - name: Version consistency
        run: python scripts/verify_versions.py

  native-test:
    name: Native Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo test --locked --all-targets --all-features
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: "1.88.0"
      - run: cargo check --locked --all-features
      - run: cargo test --locked --all-targets --all-features

  security:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rust advisory audit
        run: cargo audit

      - name: Python advisory audit
        run: |
          python -m pip_audit .
          python -m pip_audit

      - name: Validate expiring exceptions
        run: python scripts/check_audit_exceptions.py

  coverage:
    name: Python And Native Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Install coverage tools
        run: |
          cargo install cargo-llvm-cov --version 0.8.6 --locked
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Python coverage gate
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=90
          coverage xml -o coverage-python.xml

      - name: Native coverage gate
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          eval "$(cargo llvm-cov show-env --sh)"
          maturin develop --features python,pyo3/extension-module
          cargo test --locked --all-targets --all-features
          pytest -q
          cargo llvm-cov report --fail-under-lines 70
          cargo llvm-cov report --lcov --output-path coverage-rust.lcov

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            coverage-python.xml
            coverage-rust.lcov
