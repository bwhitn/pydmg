name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional release version (e.g. 0.1.2) to validate during manual runs"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Determine expected version
        id: expected
        shell: bash
        run: |
          expected=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            expected="${{ inputs.release_version }}"
          fi
          echo "value=${expected}" >> "$GITHUB_OUTPUT"

      - name: Validate versions
        shell: bash
        run: |
          args=()
          if [[ -n "${{ steps.expected.outputs.value }}" ]]; then
            args+=(--expected "${{ steps.expected.outputs.value }}")
          fi
          python scripts/verify_versions.py "${args[@]}"

  quality:
    name: Release Quality And Security Gates
    needs: [verify-version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install verification tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-llvm-cov --version 0.8.6 --locked
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Python lint, typing, and security lint
        run: |
          ruff check .
          mypy
          bandit -q -r python scripts

      - name: Rust format and lint
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: Dependency and policy audits
        run: |
          cargo audit
          python -m pip_audit .
          python -m pip_audit
          python scripts/check_audit_exceptions.py
          python scripts/check_licenses.py

      - name: Python coverage gate
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=90

      - name: Native coverage gate
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          eval "$(cargo llvm-cov show-env --sh)"
          maturin develop --features python,pyo3/extension-module
          cargo test --locked --all-targets --all-features
          pytest -q
          cargo llvm-cov report --fail-under-lines 70

      - name: Documentation build
        run: |
          python scripts/build_pydoc.py --cleanup
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

  fuzz-smoke:
    name: Release Fuzz (${{ matrix.target }})
    needs: [verify-version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dmg_parse, blkx, chunk, gpt]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: "1.98.1"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: nightly-2026-09-01
          components: rust-src

      - name: Install fuzz tooling
        run: |
          cargo +nightly-2026-09-01 install cargo-fuzz --version 0.13.2 --locked
          python -m pip install -e ".[test]"

      - name: Prepare structure-aware corpus
        run: python scripts/prepare_fuzz_corpus.py --output-dir "${{ runner.temp }}/corpus"

      - name: Run release smoke campaign
        run: |
          fuzz_log="${RUNNER_TEMP}/release-fuzz-${{ matrix.target }}.log"
          if cargo +nightly-2026-09-01 fuzz run --sanitizer address --build-std "${{ matrix.target }}" \
              "${{ runner.temp }}/corpus/${{ matrix.target }}" -- \
              -max_total_time=30 -max_len=4194304 -timeout=10 -rss_limit_mb=3072 \
              -dict=fuzz/dictionaries/dmg.dict -print_final_stats=1 \
              >"${fuzz_log}" 2>&1; then
            tail -n 40 "${fuzz_log}"
          else
            grep -E '^(SUMMARY:|stat::)' "${fuzz_log}" || true
            echo "::error::Release fuzz target failed; reproduce on a private runner before disclosure."
            exit 1
          fi

  performance:
    name: Release Performance Evidence
    needs: [verify-version]
    runs-on: ubuntu-latest
    env:
      LZMA_API_STATIC: "1"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.98.1"

      - name: Build production and instrumented release artifacts
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install maturin==1.14.1
          .venv/bin/maturin build --release --locked --auditwheel check --out "${RUNNER_TEMP}/performance-dist"
          .venv/bin/maturin develop --release --locked --features benchmarking

      - name: Measure immutable release revision
        shell: bash
        run: |
          wheel="$(find "${RUNNER_TEMP}/performance-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel}"
          .venv/bin/python scripts/benchmark.py \
            --label "release-${GITHUB_SHA}" \
            --samples 9 \
            --warmups 2 \
            --wheel "${wheel}" \
            --publish \
            --output "${RUNNER_TEMP}/pydmg-release-performance.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-performance-${{ github.sha }}
          path: ${{ runner.temp }}/pydmg-release-performance.json

  build-wheels:
    name: Wheels (${{ matrix.target }})
    needs: [quality, fuzz-smoke, performance]
    runs-on: ${{ matrix.os }}
    env:
      LZMA_API_STATIC: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.98.1"
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --auditwheel check --out dist
          sccache: "true"

      - uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CFLAGS: -std=gnu99
          CFLAGS_aarch64_unknown_linux_gnu: -std=gnu99
          "CFLAGS_aarch64-unknown-linux-gnu": -std=gnu99
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.98.1"
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --auditwheel check --out dist
          sccache: "true"

      - uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        if: ${{ !startsWith(matrix.target, 'x86_64-unknown-linux') && !startsWith(matrix.target, 'aarch64-unknown-linux') }}
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.98.1"
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --auditwheel check --out dist
          sccache: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Source Distribution
    needs: [quality, fuzz-smoke, performance]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.98.1"
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  verify-artifacts:
    name: Verify Distribution Metadata
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install twine==6.2.0
      - run: python -m twine check artifacts/**/*.whl artifacts/**/*.tar.gz

  publish:
    name: Publish To PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -lah dist

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
