name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional release version (e.g. 0.1.0) to validate during manual runs"
        required: false
        default: ""

jobs:
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine expected version
        id: expected
        shell: bash
        run: |
          expected=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            expected="${{ inputs.release_version }}"
          fi
          echo "value=${expected}" >> "$GITHUB_OUTPUT"

      - name: Validate versions
        shell: bash
        run: |
          args=()
          if [[ -n "${{ steps.expected.outputs.value }}" ]]; then
            args+=(--expected "${{ steps.expected.outputs.value }}")
          fi
          python scripts/verify_versions.py "${args[@]}"

      - name: Dependency license policy
        run: python scripts/check_licenses.py
  build-wheels:
    name: Wheels (${{ matrix.target }})
    needs: [verify-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
          sccache: "true"

      - uses: PyO3/maturin-action@v1
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CFLAGS: -std=gnu99
          CFLAGS_aarch64_unknown_linux_gnu: -std=gnu99
          "CFLAGS_aarch64-unknown-linux-gnu": -std=gnu99
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
          sccache: "true"

      - uses: PyO3/maturin-action@v1
        if: ${{ !startsWith(matrix.target, 'x86_64-unknown-linux') && !startsWith(matrix.target, 'aarch64-unknown-linux') }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Source Distribution
    needs: [verify-version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: Publish To PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -lah dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
