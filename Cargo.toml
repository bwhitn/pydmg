[package]
name = "pydmg"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cross-platform Python bindings for Apple DMG files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bwhitn/pydmg"
homepage = "https://github.com/bwhitn/pydmg"
documentation = "https://github.com/bwhitn/pydmg#readme"

[lib]
name = "pydmg"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
apple-dmg = "0.5.0"
base64 = "0.22"
crc32fast = "1.5"
dpp = "0.3.0"
fatfs = "0.3.6"
flate2 = "1.1"
gpt = "4.1.0"
plist = "1.8"
pyo3 = { version = "0.22", features = ["abi3-py39", "extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
